aid: gradium
name: Gradium
description: >-
  Gradium is a voice AI lab (Paris and Silicon Valley) building audio language models
  for real-time, low-latency Text-to-Speech, Speech-to-Text, and Speech-to-Speech
  translation. Founded in 2025 by ex-DeepMind / Meta / Kyutai researchers (Neil
  Zeghidour, Olivier Teboul, Laurent Mazaré, Alexandre Défossez), Gradium exposes a
  developer API over REST and WebSocket featuring instant voice cloning from a
  10-second sample, custom pronunciation dictionaries, sub-300ms time-to-first-token
  streaming, and multilingual support (English, French, German, Spanish, Portuguese).
  It ships first-party Python and Rust SDKs, a `gradium` CLI, and the open-source
  gradbot voice-agent framework, and is available on AWS Marketplace / SageMaker.
  Backed by a $70M seed round with participation from Amplify Partners, Eric Schmidt,
  and Xavier Niel.
